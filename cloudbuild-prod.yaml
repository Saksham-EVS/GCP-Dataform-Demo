logsBucket: "gs://x-to-bq-training/bq-dataform_demo/logs"
steps:

  # ----------------------------------------------------
  # 1. (Optional) Print environment metadata for debugging
  # ----------------------------------------------------
  - id: "Debug Build Info"
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        echo "Starting Production CD Pipeline..."
        echo "Branch: $BRANCH_NAME"
        echo "Commit: $COMMIT_SHA"

  # ----------------------------------------------------
  # 2. Trigger Composer DAG directly from Cloud Build
  # ----------------------------------------------------
  - id: "Trigger Composer DAG via Composer 3 API"
    name: gcr.io/cloud-builders/curl
    entrypoint: bash
    args:
      - -c
      - |
        echo "Triggering DAG: dataform_prod_cd on Composer 3"

        curl -X POST \
          -H "Authorization: Bearer $(gcloud auth print-access-token)" \
          -H "Content-Type: application/json" \
          -d '{"dagId": "dataform_prod_cd"}' \
          "https://composer.googleapis.com/v1/projects/neat-striker-447409-t5/locations/us-central1/environments/dataform-env:run"


timeout: "1200s"   # 20 minutes