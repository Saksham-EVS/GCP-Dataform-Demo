logsBucket: "gs://x-to-bq-training/bq-dataform_demo/logs"

steps:
  - id: "Creating json file"
    name: "node:20"
    entrypoint: "bash"
    secretEnv: ["_DF_CRED"]
    args:
      - -c
      - |
        echo "$_DF_CRED" > /workspace/.df-credentials.json

  # - id: "Install and Compile Dataform"
  #   name: "node:20"
  #   entrypoint: "bash"
  #   args:
  #     - -c
  #     - |
  #       npm install -g @dataform/cli
  #       dataform compile --json > /workspace/compilation_result.json

  - id: "Create Compilation Result Resource"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "bash"
    args:
      - -c
      - |
        gcloud dataform compilation-results create \
          --repository=dataform-demo \
          --workspace=feature-saksham \
          --location=us-central1 \
          --project=neat-striker-447409-t5 \
          --format=json > /workspace/compilation_result_api.json
        
        jq -r '.name' /workspace/compilation_result_api.json > /workspace/compilation_result_uri

  - id: "Execute Dataform Unit Tests"
    name: "python:3.11"
    entrypoint: "bash"
    args:
      - -c
      - |
        apt-get update && apt-get install -y jq
        pip install --upgrade pip
        pip install dataform-unit-tests
        export COMPILATION_RESULT="$(cat /workspace/compilation_result_uri)"
        export GCP_PROJECT_ID=neat-striker-447409-t5
        python -m dataform_unit_testing

availableSecrets:
  secretManager:
    - versionName: "projects/648723306784/secrets/Dataform-sec/versions/latest"
      env: "_DF_CRED"