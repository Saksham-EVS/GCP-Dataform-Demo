logsBucket: "gs://x-to-bq-training/bq-dataform_demo/logs"

steps:
  - id: "Creating json file"
    name: "node:20"
    entrypoint: "bash"
    secretEnv: ["_DF_CRED"]
    args:
      - -c
      - |
        echo "$_DF_CRED" > /workspace/.df-credentials.json

  - id: "Create Compilation Result Resource"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: bash
    args:
      - -c
      - |
        apt-get update && apt-get install -y jq

        gcloud auth activate-service-account --key-file=/workspace/.df-credentials.json
        ACCESS_TOKEN=$(gcloud auth print-access-token)

        PROJECT="neat-striker-447409-t5"
        LOCATION="us-central1"
        REPO="dataform-demo"

        API_URL="https://dataform.googleapis.com/v1beta1/projects/${PROJECT}/locations/${LOCATION}/repositories/${REPO}/compilationResults"

        RESPONSE=$(curl -s -X POST \
          -H "Authorization: Bearer $ACCESS_TOKEN" \
          -H "Content-Type: application/json" \
          "$API_URL")

        COMPILATION_RESULT_ID=$(echo "$RESPONSE" | jq -r '.name')

        echo "$COMPILATION_RESULT_ID" > /workspace/compilation_result_id.txt



  - id: "Execute Dataform Unit Tests"
    name: "python:3.11"
    entrypoint: "bash"
    args:
      - -c
      - |
        apt-get update && apt-get install -y jq
        pip install --upgrade pip
        pip install dataform-unit-tests
        export COMPILATION_RESULT="$(cat /workspace/compilation_result_id.txt)"
        export GCP_PROJECT_ID=neat-striker-447409-t5
        python -m dataform_unit_testing


availableSecrets:
  secretManager:
    - versionName: "projects/648723306784/secrets/Dataform-sec/versions/latest"
      env: "_DF_CRED"
