logsBucket: "gs://x-to-bq-training/bq-dataform_demo/logs"
substitutions:
  _LOCATION: us-central1
  _REPO: dataform-demo
  _PROJECT: neat-striker-447409-t5
  _WORKSPACE: feature-saksham
steps:
  - id: "Create Compilation Result Resource"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "bash"
    secretEnv: ['DF_CRED']
    args:
      - -c
      - |
        apt-get update && apt-get install -y jq
        echo "$$DF_CRED" > /workspace/.df-credentials.json
        gcloud auth activate-service-account --key-file=/workspace/.df-credentials.json --project=${_PROJECT} --quiet
        curl -s -X POST \
          -H "Authorization: Bearer $(gcloud auth print-access-token)" \
          -H "Content-Type: application/json" \
          -d '{"gitCommitish":"dev"}' \
          "https://dataform.googleapis.com/v1beta1/projects/${_PROJECT}/locations/${_LOCATION}/repositories/${_REPO}/compilationResults" \
          | tee /workspace/response.json
        echo "------------------------------- RESPONSE FROM API -------------------------"
        echo "$_RESPONSE" | tee /workspace/response.json

        _COMPILATION_RESULT_ID=$(jq -r '.name' /workspace/response.json) 
        echo "$_COMPILATION_RESULT_ID" > /workspace/compilation_result_id.txt
        echo "------------------------------ COMPILATION_RESULT_ID --------------------------"
        echo "Compilation Result ID: ${_COMPILATION_RESULT_ID}"

        echo "$_COMPILATION_RESULT_ID" | tee /workspace/compilation_result_id.txt
        echo "-------------------------------------------------------------------------------"
        cat /workspace/compilation_result_id.txt
        echo "-------------------------------------------------------------------------------"



  - id: "Execute Dataform Unit Tests"
    name: "python:3.11"
    entrypoint: "bash"
    args:
      - -c
      - |
        pip install --upgrade pip
        pip install --no-cache-dir --force-reinstall dataform-unit-tests
        pip install --no-cache-dir db-dtypes pandas pyarrow
        export COMPILATION_RESULT="$(cat /workspace/compilation_result_id.txt)"
        export GCP_PROJECT_ID=neat-striker-447409-t5
        python -m dataform-unit-tests

# export COMPILATION_RESULT="$(cat /workspace/compilation_result_id.txt)"

availableSecrets:
  secretManager:
    - versionName: projects/648723306784/secrets/Dataform-secret/versions/latest
      env: 'DF_CRED'
