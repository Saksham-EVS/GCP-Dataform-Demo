logsBucket: "gs://x-to-bq-training/bq-dataform_demo/logs"

steps:
  - id: "Dataform CI"
    name: "node:20"
    entrypoint: bash
    secretEnv: ["DF_CRED"]
    args:
      - -c
      - |
        # Write credentials to Dataform's expected location
        echo "$DF_CRED" > /workspace/.df-credentials.json

        npm install -g @dataform/cli
        dataform --version
        dataform compile
        dataform test

availableSecrets:
  secretManager:
    - versionName: projects/648723306784/secrets/Dataform-sec
      env: "DF_CRED"
