logsBucket: "gs://x-to-bq-training/bq-dataform_demo/logs"

steps:
    - id: "Installation Dataform"
    - name: "node:20"
      entrypoint: "bash"
      args:
        - "-c"
        - |
          npm install -g @dataform/core
    
    - id: "Compilation"
    - name: "node:20"
      entrypoint: "bash"
      args:
        - "-c"
        - |
          dataform compile

    - id: "Testing"
    - name: "node:20"
      entrypoint: "bash"
      args:
        - "-c"
        - |
          dataform test