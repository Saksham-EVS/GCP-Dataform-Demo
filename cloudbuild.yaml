logsBucket: "gs://x-to-bq-training/bq-dataform_demo/logs"

steps:
  - id: "Creating json file"
    name: "node:20"
    entrypoint: "bash"
    secretEnv: ["_DF_CRED"]
    args:
      - -c
      - |
        echo "$_DF_CRED" > /workspace/.df-credentials.json

  - id: "Install and Compile Dataform"
    name: "node:20"
    entrypoint: "bash"
    args:
      - -c
      - |
        npm install -g @dataform/cli
        dataform compile

availableSecrets:
  secretManager:
    - versionName: "projects/648723306784/secrets/Dataform-sec/versions/latest"
      env: "_DF_CRED"

