logsBucket: "gs://x-to-bq-training/bq-dataform_demo/logs"
substitutions:
  _LOCATION: us-central1
  _REPO: dataform-demo
  _PROJECT: neat-striker-447409-t5

steps:
  - id: "Dataform Compilation"
    name: "node:20"
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo ">>> Installing Dataform CLI..."
        npm install -g @dataform/cli 
        echo ">>> Compiling Dataform project..."
        dataform compile --project-dir . 
        echo ">>> Compilation finished."

  - id: "Create Compilation Result Resource"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: bash
    secretEnv: ['DF_CRED']
    args:
      - -c
      - |
        set -euo pipefail
        echo ">>> Authenticating with GCP..."
        echo "$$DF_CRED" > /workspace/.df-credentials.json
        gcloud auth activate-service-account --key-file=/workspace/.df-credentials.json --project=${_PROJECT} --quiet
        echo ">>> Creating compilation result resource..."
        curl -s -X POST \
          -H "Authorization: Bearer $(gcloud auth print-access-token)" \
          -H "Content-Type: application/json" \
          -d '{"gitCommitish":"dev"}' \
          "https://dataform.googleapis.com/v1beta1/projects/${_PROJECT}/locations/${_LOCATION}/repositories/${_REPO}/compilationResults" \
          | tee /workspace/response.json
        tr -d '\r' < /workspace/response.json | jq '.' | tee /workspace/response_clean.json
        echo ">>> Compilation result resource created."

  - id: "Execute Dataform Unit Tests"
    name: "python:3.11"
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo ">>> Installing Python dependencies..."
        apt-get update && apt-get install -y jq | tee /workspace/apt_install.log
        pip install --upgrade pip | tee /workspace/pip_upgrade.log
        pip install dataform-unit-tests google-cloud-bigquery-storage db-dtypes pandas pyarrow | tee /workspace/pip_install.log
        echo ">>> Running Dataform unit tests..."
        export COMPILATION_RESULT="$(jq -r '.name' /workspace/response_clean.json)"
        export GCP_PROJECT_ID=${_PROJECT}
        python -m dataform_unit_testing | tee /workspace/unit_tests.log
        echo ">>> Unit tests completed."

  - id: "Create and Merge PR to test"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: bash
    secretEnv: ["DF_GITHUB_TOKEN"]
    args:
      - -c
      - |
        set -euo pipefail
        echo ">>> Installing GitHub CLI..."
        apt-get update -y && apt-get install -y wget git >/dev/null
        wget -q https://github.com/cli/cli/releases/download/v2.62.0/gh_2.62.0_linux_amd64.deb
        apt-get install -y ./gh_2.62.0_linux_amd64.deb >/dev/null
        echo ">>> Authenticating GitHub CLI..."
        echo "$$DF_GITHUB_TOKEN" | gh auth login --with-token
        echo ">>> Creating PR from dev → test..."
        gh pr create \
          --repo "Saksham-EVS/GCP-Dataform-Demo" \
          --base test \
          --head dev \
          --title "Promote dev → test (Automated CI)" \
          --body "Automated promotion triggered after successful Dataform unit tests." \
        | tee /workspace/pr_create.log \
        | xargs gh pr merge --merge --admin | tee /workspace/pr_merge.log
        echo ">>> PR merged successfully!"

availableSecrets:
  secretManager:
    - versionName: projects/648723306784/secrets/Dataform-secret/versions/latest
      env: 'DF_CRED'
    - versionName: projects/648723306784/secrets/Dataform-ss-evs/versions/latest
      env: "DF_GITHUB_TOKEN"
