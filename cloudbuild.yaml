logsBucket: "gs://x-to-bq-training/bq-dataform_demo/logs"

steps:
    - name: "Installation Dataform"
      entrypoint: "bash"
      args:
        - "-c"
        - |
          npm install -g @dataform/core
    
    - name: "Compilation"
      entrypoint: "bash"
      args:
        - "-c"
        - |
          dataform compile

    - name: "Testing"
      entrypoint: "bash"
      args:
        - "-c"
        - |
          dataform test